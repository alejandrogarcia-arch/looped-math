# Configuración por defecto de arquitectura y entrenamiento

model:
  arch: looped
  vocab_size: 100
  context_length: 512
  emb_dim: 256
  n_heads: 8
  n_layers: 1
  n_loops: 4
  drop_rate: 0.0
  qkv_bias: false

train:
  lr: 1.0e-3
  min_lr: 1.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  warmup_steps: 200
  total_steps: 10000
  batch_size: 64
  grad_clip: 1.0
  eval_every: 250
  precision: auto       # bf16 si la GPU lo soporta; si no, fp16 con GradScaler (o fp32 en CPU)
  seeds: [0, 1, 2]
